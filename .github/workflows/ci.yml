name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  # pi releases often; a daily run catches a release that breaks rho before a
  # session does.
  schedule:
    - cron: '17 6 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # bundled context-mode depends on better-sqlite3, which has no prebuild
      # for bun's own node ABI and then builds from source. a real node gives it
      # a prebuild to use, so the install needs no compiler on the runner.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run typecheck
      - run: bun test tests/

  # the smoke job runs `bun install` before pi ever sees the package, and bun
  # does not enforce peer ranges. this job meets npm cold, the way a user
  # installing from git does.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # rho's runtime packages are linked from the installed pi, so pi has to
      # be there before the install runs.
      - run: bun install -g @earendil-works/pi-coding-agent
      - run: bun ci/install-check.ts
        timeout-minutes: 10

  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pi-version: [latest]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/Dockerfile
          build-args: PI_VERSION=${{ matrix.pi-version }}
          tags: rho-smoke:${{ matrix.pi-version }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: run smoke test
        run: docker run --rm rho-smoke:${{ matrix.pi-version }}
        timeout-minutes: 15
