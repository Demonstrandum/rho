<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prompt explorer</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --bg: #0d1117;
    --bg-surface: #161b22;
    --bg-hover: #1c2129;
    --bg-selected: #1f6feb22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-dim: #484f58;
    --text-muted: #8b949e;
    --red: #f85149;
    --red-dim: #f8514933;
    --yellow: #d29922;
    --yellow-dim: #d2992233;
    --green: #3fb950;
    --blue: #58a6ff;
    --mono: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', Consolas, monospace;
}

body {
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.5;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
}

header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}

header h1 {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-muted);
    white-space: nowrap;
}

.actions {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: auto;
}

#search {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 4px 8px;
    width: 200px;
    outline: none;
}
#search:focus { border-color: var(--blue); }
#search::placeholder { color: var(--text-dim); }

button {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-muted);
    font-family: var(--mono);
    font-size: 12px;
    padding: 4px 10px;
    cursor: pointer;
    white-space: nowrap;
}
button:hover { background: var(--bg-hover); color: var(--text); }
button:active { background: var(--border); }
button.danger { color: var(--red); }
button.primary { color: var(--blue); }

#status {
    font-size: 12px;
    color: var(--text-dim);
    white-space: nowrap;
}

.layout {
    display: flex;
    flex: 1;
    overflow: hidden;
}

main {
    flex: 1;
    overflow-y: auto;
    padding: 0;
}

aside {
    width: 0;
    overflow: hidden;
    transition: width 0.2s ease;
    border-left: 1px solid var(--border);
    background: var(--bg-surface);
    display: flex;
    flex-direction: column;
}
aside.open { width: 45%; min-width: 400px; }

.diff-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    color: var(--text-muted);
    flex-shrink: 0;
}

#diff-content {
    flex: 1;
    overflow: auto;
    padding: 12px;
    font-size: 12px;
    line-height: 1.6;
    white-space: pre;
    tab-size: 4;
}
.diff-add { color: var(--green); }
.diff-del { color: var(--red); }
.diff-hunk { color: var(--blue); }
.diff-file { color: var(--yellow); font-weight: 600; }

footer {
    display: flex;
    align-items: center;
    padding: 6px 16px;
    background: var(--bg-surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    gap: 16px;
}

.file-header {
    padding: 6px 16px;
    font-weight: 600;
    font-size: 12px;
    background: var(--bg-surface);
    border-top: 2px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 2;
    user-select: none;
}

.line {
    display: flex;
    align-items: stretch;
    min-height: 26px;
    cursor: pointer;
    position: relative;
}
.line:hover { background: var(--bg-hover); }
.line.selected { background: var(--bg-selected); }

.line.deleted {
    background: var(--red-dim);
    text-decoration: line-through;
    opacity: 0.6;
}
.line.modified { background: var(--yellow-dim); }

.gutter {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    width: 52px;
    min-width: 52px;
    padding: 0 8px 0 4px;
    color: var(--text-dim);
    font-size: 12px;
    user-select: none;
    border-right: 1px solid var(--border);
}

.marker {
    width: 16px;
    min-width: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: var(--text-dim);
    user-select: none;
}
.line.deleted .marker { color: var(--red); }
.line.modified .marker { color: var(--yellow); }

.content {
    flex: 1;
    padding: 0 8px;
    white-space: pre;
    overflow: visible;
    display: flex;
    align-items: center;
    min-height: 22px;
}

.content[contenteditable="true"] {
    outline: 1px solid var(--blue);
    outline-offset: -1px;
    background: var(--bg);
    cursor: text;
    white-space: pre-wrap;
}

.line .delete-btn {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0;
    background: none;
    border: none;
    color: var(--red);
    font-size: 14px;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
}
.line:hover .delete-btn { opacity: 0.6; }
.line .delete-btn:hover { opacity: 1; }

.search-match {
    background: var(--yellow-dim);
    border-radius: 2px;
}

/* swap group: faint box, no layout shift */
.swap-group {
    position: relative;
    outline: 1px solid #484f5850;
    outline-offset: -1px;
    border-radius: 3px;
    margin: 2px 0;
}
.swap-group-label {
    position: absolute;
    top: 0;
    right: 8px;
    font-size: 10px;
    color: var(--text-dim);
    opacity: 0.6;
    pointer-events: none;
    white-space: nowrap;
    line-height: 22px;
    z-index: 1;
}


/* collapse toggle */
.collapse-toggle {
    cursor: pointer;
    user-select: none;
    font-size: 10px;
    width: 14px;
    text-align: center;
    color: var(--text-dim);
    flex-shrink: 0;
    opacity: 0.6;
    transition: opacity 0.1s;
}
.collapse-toggle:hover { opacity: 1; color: var(--text); }
.line .collapse-toggle {
    position: absolute;
    left: 2px;
    top: 50%;
    transform: translateY(-50%);
}
.heading-line { cursor: pointer; }
.heading-line:hover .collapse-toggle { opacity: 1; }

/* raw tab in file headers */
.file-header {
    display: flex;
    align-items: center;
    gap: 8px;
}
.file-header-label { flex: 1; }
.raw-toggle {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 3px;
    opacity: 0.5;
    flex-shrink: 0;
}
.raw-toggle:hover { opacity: 1; }
.raw-toggle.active {
    opacity: 1;
    background: var(--border);
    color: var(--text);
}
/* raw mode: directive highlights inline */
.line .directive {
    color: var(--blue);
    opacity: 0.8;
}

/* span-level source annotations (data from JSON) */
.data-span {
    position: relative;
    outline: 1px solid #58a6ff55;
    outline-offset: 0px;
    border-radius: 2px;
    padding: 0 1px;
    margin: 3px 0;
    line-height: 1;
}
.data-span .span-label {
    position: absolute;
    top: -5px;
    left: 2px;
    font-size: 8px;
    line-height: 1;
    padding: 0 2px;
    color: #58a6ff;
    background: var(--bg);
    border-radius: 2px;
    pointer-events: none;
    white-space: nowrap;
    opacity: 1;
    transition: opacity 0.15s;
    z-index: 1;
}
.data-span:hover { outline-color: #58a6ffaa; background: #58a6ff0c; }
.data-span:hover .span-label { opacity: 1; }

/* patch modal */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
}
.modal {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 70vw;
    max-width: 900px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
}
.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    color: var(--text-muted);
}
.modal-body {
    flex: 1;
    overflow: auto;
    padding: 12px 16px;
    font-size: 12px;
    line-height: 1.6;
    white-space: pre;
}
.modal-footer {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-top: 1px solid var(--border);
}
.modal-footer .filename {
    flex: 1;
    font-size: 12px;
    color: var(--text-dim);
}

.toast {
    position: fixed;
    bottom: 48px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 12px;
    color: var(--text);
    z-index: 100;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
    <h1>prompt explorer</h1>
    <div class="actions">
        <input type="search" id="search" placeholder="/ search...">
        <button onclick="undo()" title="ctrl+z">undo</button>
        <button class="primary" onclick="showDiff()" title="d">diff</button>
        <button class="primary" onclick="savePatch()">patch</button>
        <button class="danger" onclick="applyChanges()">apply</button>
    </div>
</header>
<div class="layout">
    <main id="lines-container"></main>
    <aside id="diff-panel">
        <div class="diff-header">
            <span>diff</span>
            <button onclick="closeDiff()">close</button>
        </div>
        <div id="diff-content"></div>
    </aside>
</div>
<footer>
    <span id="status">loading...</span>
</footer>
<div class="toast" id="toast"></div>

<script>
const FILE_COLORS = ['#58a6ff', '#d29922', '#bc8cff', '#3fb950', '#f47067', '#79c0ff'];
let colorMap = {};
let colorIdx = 0;

function fileColor(path) {
    if (!(path in colorMap)) {
        colorMap[path] = FILE_COLORS[colorIdx % FILE_COLORS.length];
        colorIdx++;
    }
    return colorMap[path];
}

let expandedLines = [];  // original from server, never mutated
let lines = [];          // current display lines (rebuilt on mode switch)
let rawFileLines = {};   // { 'file.md': SourceLine[] }, cached
let rawMode = {};        // { 'file.md': true }
let collapsed = new Set(); // 'file:name' or 'heading:INDEX'
let modifications = {};
let undoStack = [];
let selectedIndex = -1;
let editingIndex = -1;

function headingLevel(text) {
    const m = text.match(/^(#{1,6})\s/);
    return m ? m[1].length : 0;
}

// compute which lines are visible given collapse state
function computeVisibility() {
    const vis = new Array(lines.length).fill(true);
    let currentFile = null;
    let fileHidden = false;

    // pass 1: file-level collapse
    for (let i = 0; i < lines.length; i++) {
        if (lines[i].source.kind === 'header') {
            currentFile = lines[i].source.label;
            fileHidden = collapsed.has('file:' + currentFile);
            vis[i] = true; // header always visible
            continue;
        }
        if (fileHidden) vis[i] = false;
    }

    // pass 2: heading-level collapse
    for (let i = 0; i < lines.length; i++) {
        if (!vis[i]) continue;
        const level = headingLevel(lines[i].text);
        if (level > 0 && collapsed.has('heading:' + i)) {
            for (let j = i + 1; j < lines.length; j++) {
                if (lines[j].source.kind === 'header') break;
                const jLevel = headingLevel(lines[j].text);
                if (jLevel > 0 && jLevel <= level) break;
                vis[j] = false;
            }
        }
    }
    return vis;
}

function toggleFileCollapse(file) {
    const key = 'file:' + file;
    if (collapsed.has(key)) collapsed.delete(key); else collapsed.add(key);
    renderLines();
}

function toggleHeadingCollapse(idx) {
    const key = 'heading:' + idx;
    if (collapsed.has(key)) collapsed.delete(key); else collapsed.add(key);
    renderLines();
}

// rebuild display lines from expandedLines, swapping in raw lines for sections in raw mode
function rebuildDisplayLines() {
    const result = [];
    let i = 0;
    while (i < expandedLines.length) {
        const line = expandedLines[i];
        if (line.source.kind === 'header') {
            const file = line.source.label;
            result.push(line);
            i++;
            if (rawMode[file] && rawFileLines[file]) {
                // skip expanded lines, insert raw lines
                while (i < expandedLines.length && expandedLines[i].source.kind !== 'header') i++;
                for (const rl of rawFileLines[file]) result.push(rl);
            } else {
                while (i < expandedLines.length && expandedLines[i].source.kind !== 'header') {
                    result.push(expandedLines[i]);
                    i++;
                }
            }
        } else {
            result.push(line);
            i++;
        }
    }
    return result;
}

function changeCount() {
    let deleted = 0, modified = 0;
    for (const [, mod] of Object.entries(modifications)) {
        if (mod.deleted) deleted++;
        else if (mod.edited !== undefined) modified++;
    }
    return { deleted, modified };
}

function updateStatus() {
    const { deleted, modified } = changeCount();
    const total = lines.filter(l => l.source.kind !== 'header').length;
    let s = `${total} lines`;
    if (deleted > 0) s += `  \u00b7  ${deleted} deleted`;
    if (modified > 0) s += `  \u00b7  ${modified} modified`;
    document.getElementById('status').textContent = s;
}

function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2000);
}

function gutterText(source) {
    if (source.kind === 'file') return String(source.line).padStart(4, '\u2007');
    if (source.kind === 'expr') return '   ~';
    return '';
}

function markerText(idx) {
    const mod = modifications[idx];
    if (!mod) return ' ';
    if (mod.deleted) return '\u00d7';
    if (mod.edited !== undefined) return '\u2022';
    return ' ';
}

function isExprLine(line) {
    return line && line.source.kind === 'expr';
}

function isExprFromSameLine(line, exprLine) {
    return line && line.source.kind === 'expr'
        && line.source.path === exprLine.source.path
        && line.source.line === exprLine.source.line;
}

function renderLines() {
    const container = document.getElementById('lines-container');
    container.innerHTML = '';
    const vis = computeVisibility();

    let i = 0;
    while (i < lines.length) {
        const line = lines[i];

        // file header with collapse toggle and raw tab
        if (line.source.kind === 'header') {
            const file = line.source.label;
            const isFileCollapsed = collapsed.has('file:' + file);
            const el = document.createElement('div');
            el.className = 'file-header';
            el.style.color = fileColor(file);
            el.style.borderTopColor = fileColor(file) + '66';

            const toggle = document.createElement('span');
            toggle.className = 'collapse-toggle';
            toggle.textContent = isFileCollapsed ? '\u25b8' : '\u25be';
            toggle.onclick = (e) => { e.stopPropagation(); toggleFileCollapse(file); };
            el.appendChild(toggle);

            const label = document.createElement('span');
            label.className = 'file-header-label';
            label.textContent = '\u2500\u2500 ' + file + ' ' + '\u2500'.repeat(50);
            label.style.cursor = 'pointer';
            label.onclick = () => toggleFileCollapse(file);
            el.appendChild(label);

            const isRaw = !!rawMode[file];
            const rawBtn = document.createElement('button');
            rawBtn.className = 'raw-toggle' + (isRaw ? ' active' : '');
            rawBtn.textContent = isRaw ? 'expanded' : 'raw';
            rawBtn.onclick = (e) => { e.stopPropagation(); toggleRaw(file, rawBtn); };
            el.appendChild(rawBtn);

            container.appendChild(el);

            i++;
            continue;
        }

        // expression group: wrap consecutive lines from the same expression
        if (isExprLine(line) && line.spans) {
            const exprRef = line;
            const groupStart = i;
            while (i < lines.length && isExprFromSameLine(lines[i], exprRef)) {
                i++;
            }

            // check if any line in group is visible
            let anyVis = false;
            for (let j = groupStart; j < i; j++) if (vis[j]) anyVis = true;
            if (!anyVis) continue;

            const group = document.createElement('div');
            group.className = 'swap-group';

            const groupLabel = document.createElement('span');
            groupLabel.className = 'swap-group-label';
            groupLabel.textContent = `${exprRef.source.path}:${exprRef.source.line} expr`;
            group.appendChild(groupLabel);

            for (let j = groupStart; j < i; j++) {
                if (vis[j]) group.appendChild(buildLine(lines[j], j));
            }
            container.appendChild(group);
            continue;
        }

        // skip hidden lines
        if (!vis[i]) { i++; continue; }

        // normal line (with heading collapse toggle if it's a heading)
        const lineEl = buildLine(line, i);
        const hLevel = headingLevel(line.text);
        if (hLevel > 0) {
            lineEl.classList.add('heading-line');
            const toggle = document.createElement('span');
            toggle.className = 'collapse-toggle';
            toggle.textContent = collapsed.has('heading:' + i) ? '\u25b8' : '\u25be';
            const idx = i;
            toggle.onclick = (e) => { e.stopPropagation(); toggleHeadingCollapse(idx); };
            lineEl.prepend(toggle);
        }
        container.appendChild(lineEl);
        i++;
    }

    updateStatus();
}

function buildLine(line, i) {
    const mod = modifications[i];
    const el = document.createElement('div');
    el.className = 'line';
    if (mod?.deleted) el.classList.add('deleted');
    else if (mod?.edited !== undefined) el.classList.add('modified');
    if (i === selectedIndex) el.classList.add('selected');
    el.dataset.index = i;

    const gutter = document.createElement('span');
    gutter.className = 'gutter';
    gutter.textContent = gutterText(line.source);

    const marker = document.createElement('span');
    marker.className = 'marker';
    marker.textContent = markerText(i);

    const content = document.createElement('span');
    content.className = 'content';
    const displayText = mod?.edited !== undefined ? mod.edited : line.text;

    // highlight {{...}} directives in raw-mode lines
    const fileInRaw = line.source.kind === 'file' && rawMode[line.source.path];
    if (fileInRaw && displayText.includes('{{')) {
        const parts = displayText.split(/(\{\{[^}]+\}\})/g);
        for (const part of parts) {
            if (part.match(/^\{\{[^}]+\}\}$/)) {
                const s = document.createElement('span');
                s.className = 'directive';
                s.textContent = part;
                content.appendChild(s);
            } else {
                content.appendChild(document.createTextNode(part));
            }
        }
    } else if (line.spans && !mod?.edited && !mod?.deleted) {
        // render spans with source annotations
        for (const span of line.spans) {
            if (span.source) {
                const wrap = document.createElement('span');
                wrap.className = 'data-span';
                wrap.textContent = span.text;
                const label = document.createElement('span');
                label.className = 'span-label';
                const fname = span.source.file.split('/').pop();
                label.textContent = `${fname}:${span.source.line}:${span.source.col}`;
                wrap.appendChild(label);
                wrap.title = span.source.path || `${span.source.file}:${span.source.line}:${span.source.col}`;
                content.appendChild(wrap);
            } else {
                content.appendChild(document.createTextNode(span.text));
            }
        }
        if (line.spans.length === 0) content.textContent = ' ';
    } else {
        content.textContent = displayText || ' ';
    }

    el.onclick = () => {
        if (editingIndex === i) return;
        selectLine(i);
    };
    el.ondblclick = () => startEdit(i);

    el.appendChild(gutter);
    el.appendChild(marker);
    el.appendChild(content);

    if (line.source.kind !== 'header') {
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = '\u00d7';
        deleteBtn.onclick = (e) => { e.stopPropagation(); toggleDelete(i); };
        el.appendChild(deleteBtn);
    }

    return el;
}

// raw mode: switch a file section between expanded and raw view
async function toggleRaw(file, btn) {
    if (!rawFileLines[file]) {
        // fetch and cache raw lines
        const res = await fetch('/api/raw/' + encodeURIComponent(file));
        const data = await res.json();
        if (data.error) { toast('file not found: ' + file); return; }
        const fileLines = data.content.replace(/\n$/, '').split('\n');
        rawFileLines[file] = fileLines.map((text, i) => ({
            index: -1,
            text,
            source: { kind: 'file', path: file, line: i + 1 },
        }));
    }

    rawMode[file] = !rawMode[file];

    // clear modifications for lines in this section (indices shift)
    modifications = {};
    undoStack = [];

    lines = rebuildDisplayLines();
    selectedIndex = -1;
    editingIndex = -1;
    renderLines();
}

function selectLine(idx) {
    if (editingIndex >= 0) {
        if (editingIndex !== idx) finishEdit(editingIndex);
        return;
    }
    selectedIndex = idx;
    document.querySelectorAll('.line.selected').forEach(el => el.classList.remove('selected'));
    const el = document.querySelector(`.line[data-index="${idx}"]`);
    if (el) el.classList.add('selected');
}

function toggleDelete(idx) {
    const line = lines[idx];
    if (line.source.kind === 'generated') return;

    const prev = modifications[idx];
    undoStack.push({ index: idx, prev: prev ? { ...prev } : undefined });

    if (prev?.deleted) {
        if (prev.edited !== undefined) {
            modifications[idx] = { edited: prev.edited };
        } else {
            delete modifications[idx];
        }
    } else {
        modifications[idx] = { ...(prev || {}), deleted: true };
    }
    renderLines();
}

function startEdit(idx) {
    if (editingIndex === idx) return; // already editing; let browser handle (word select, etc.)
    const line = lines[idx];
    if (line.source.kind === 'header') return;
    const mod = modifications[idx];
    if (mod?.deleted) return;

    editingIndex = idx;
    selectedIndex = idx;

    const el = document.querySelector(`.line[data-index="${idx}"] .content`);
    if (!el) return;

    const currentText = mod?.edited !== undefined ? mod.edited : line.text;
    el.textContent = currentText;
    el.contentEditable = 'true';
    el.focus();

    // move cursor to end
    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);

    el.onkeydown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            finishEdit(idx);
        } else if (e.key === 'Escape') {
            cancelEdit(idx);
        }
    };
    el.onblur = () => {
        // small delay so click on other elements works
        setTimeout(() => { if (editingIndex === idx) finishEdit(idx); }, 100);
    };
}

function finishEdit(idx) {
    const el = document.querySelector(`.line[data-index="${idx}"] .content`);
    if (!el) { editingIndex = -1; return; }

    el.contentEditable = 'false';
    el.onkeydown = null;
    el.onblur = null;

    const newText = el.textContent || '';
    const original = lines[idx].text;
    const prev = modifications[idx];
    undoStack.push({ index: idx, prev: prev ? { ...prev } : undefined });

    if (newText === original) {
        if (prev) {
            delete modifications[idx].edited;
            if (Object.keys(modifications[idx]).length === 0) delete modifications[idx];
        }
    } else {
        modifications[idx] = { ...(prev || {}), edited: newText };
    }

    editingIndex = -1;
    renderLines();
}

function cancelEdit(idx) {
    const el = document.querySelector(`.line[data-index="${idx}"] .content`);
    if (el) {
        el.contentEditable = 'false';
        el.onkeydown = null;
        el.onblur = null;
    }
    editingIndex = -1;
    renderLines();
}

function undo() {
    const op = undoStack.pop();
    if (!op) { toast('nothing to undo'); return; }
    if (op.prev === undefined) {
        delete modifications[op.index];
    } else {
        modifications[op.index] = op.prev;
    }
    selectedIndex = op.index;
    renderLines();
    const el = document.querySelector(`.line[data-index="${op.index}"]`);
    if (el) el.scrollIntoView({ block: 'center' });
}

async function showDiff() {
    const panel = document.getElementById('diff-panel');
    const content = document.getElementById('diff-content');

    if (Object.keys(modifications).length === 0) {
        toast('no changes');
        return;
    }

    content.innerHTML = '<span style="color:var(--text-dim)">generating...</span>';
    panel.classList.add('open');

    const res = await fetch('/api/diff', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ modifications }),
    });
    const data = await res.json();

    if (!data.diff) {
        content.innerHTML = '<span style="color:var(--text-dim)">no effective changes</span>';
        return;
    }

    content.innerHTML = '';
    for (const line of data.diff.split('\n')) {
        const span = document.createElement('span');
        if (line.startsWith('+++') || line.startsWith('---')) {
            span.className = 'diff-file';
        } else if (line.startsWith('@@')) {
            span.className = 'diff-hunk';
        } else if (line.startsWith('+')) {
            span.className = 'diff-add';
        } else if (line.startsWith('-')) {
            span.className = 'diff-del';
        }
        span.textContent = line + '\n';
        content.appendChild(span);
    }
}

function closeDiff() {
    document.getElementById('diff-panel').classList.remove('open');
}

async function savePatch() {
    if (Object.keys(modifications).length === 0) {
        toast('no changes');
        return;
    }
    const res = await fetch('/api/diff', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ modifications }),
    });
    const data = await res.json();
    if (!data.diff) {
        toast('no effective changes');
        return;
    }
    showPatchModal(data.diff, data.fileCount);
}

function showPatchModal(diff, fileCount) {
    // remove existing modal
    document.querySelector('.modal-overlay')?.remove();

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

    const modal = document.createElement('div');
    modal.className = 'modal';

    // header
    const header = document.createElement('div');
    header.className = 'modal-header';
    header.innerHTML = `<span>patch (${fileCount} file${fileCount !== 1 ? 's' : ''})</span>`;
    const closeBtn = document.createElement('button');
    closeBtn.textContent = 'close';
    closeBtn.onclick = () => overlay.remove();
    header.appendChild(closeBtn);

    // body: rendered diff
    const body = document.createElement('div');
    body.className = 'modal-body';
    for (const line of diff.split('\n')) {
        const span = document.createElement('span');
        if (line.startsWith('+++') || line.startsWith('---')) span.className = 'diff-file';
        else if (line.startsWith('@@')) span.className = 'diff-hunk';
        else if (line.startsWith('+')) span.className = 'diff-add';
        else if (line.startsWith('-')) span.className = 'diff-del';
        span.textContent = line + '\n';
        body.appendChild(span);
    }

    // footer
    const footer = document.createElement('div');
    footer.className = 'modal-footer';
    const filename = document.createElement('span');
    filename.className = 'filename';
    filename.textContent = 'prompt-explorer.patch';
    footer.appendChild(filename);

    const downloadBtn = document.createElement('button');
    downloadBtn.className = 'primary';
    downloadBtn.textContent = 'download';
    downloadBtn.onclick = () => {
        const blob = new Blob([diff], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'prompt-explorer.patch';
        a.click();
        URL.revokeObjectURL(a.href);
        toast('downloaded');
    };
    footer.appendChild(downloadBtn);

    const writeBtn = document.createElement('button');
    writeBtn.className = 'primary';
    writeBtn.textContent = 'write to cwd';
    writeBtn.onclick = async () => {
        const res = await fetch('/api/patch', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ modifications }),
        });
        const data = await res.json();
        if (data.path) {
            toast(`written: ${data.path}`);
            overlay.remove();
        }
    };
    footer.appendChild(writeBtn);

    modal.appendChild(header);
    modal.appendChild(body);
    modal.appendChild(footer);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
}

async function applyChanges() {
    if (Object.keys(modifications).length === 0) {
        toast('no changes');
        return;
    }
    if (!confirm(`apply changes directly to source files?`)) return;

    const res = await fetch('/api/apply', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ modifications }),
    });
    const data = await res.json();
    if (data.applied) {
        toast(`applied to ${data.fileCount} file(s)`);
        modifications = {};
        undoStack = [];
        // reload lines from server
        const r = await fetch('/api/lines');
        expandedLines = await r.json();
        rawFileLines = {}; // invalidate raw cache
        lines = rebuildDisplayLines();
        renderLines();
    }
}

function doSearch() {
    const query = document.getElementById('search').value.toLowerCase();
    document.querySelectorAll('.search-match').forEach(el => {
        el.outerHTML = el.textContent;
    });
    if (!query) return;

    document.querySelectorAll('.line .content').forEach(el => {
        if (el.contentEditable === 'true') return;
        const text = el.textContent;
        const lower = text.toLowerCase();
        const idx = lower.indexOf(query);
        if (idx < 0) return;

        const before = text.slice(0, idx);
        const match = text.slice(idx, idx + query.length);
        const after = text.slice(idx + query.length);
        el.innerHTML = '';
        el.appendChild(document.createTextNode(before));
        const mark = document.createElement('mark');
        mark.className = 'search-match';
        mark.textContent = match;
        el.appendChild(mark);
        el.appendChild(document.createTextNode(after));
    });

    // scroll to first match
    const first = document.querySelector('.search-match');
    if (first) first.scrollIntoView({ block: 'center' });
}

// keyboard shortcuts
document.addEventListener('keydown', (e) => {
    // skip if editing or in search
    if (editingIndex >= 0) return;
    if (document.activeElement === document.getElementById('search')) {
        if (e.key === 'Enter') { doSearch(); e.preventDefault(); }
        if (e.key === 'Escape') { document.getElementById('search').blur(); }
        return;
    }

    if (e.key === 'd' && selectedIndex >= 0) { toggleDelete(selectedIndex); e.preventDefault(); }
    else if (e.key === 'e' && selectedIndex >= 0) { startEdit(selectedIndex); e.preventDefault(); }
    else if (e.key === '/' || (e.ctrlKey && e.key === 'f')) {
        document.getElementById('search').focus();
        e.preventDefault();
    }
    else if (e.ctrlKey && e.key === 'z') { undo(); e.preventDefault(); }
    else if (e.key === 'Escape') { closeDiff(); }
    else if (e.key === 'j' || e.key === 'ArrowDown') { navigateLine(1); e.preventDefault(); }
    else if (e.key === 'k' || e.key === 'ArrowUp') { navigateLine(-1); e.preventDefault(); }
});

function navigateLine(dir) {
    let i = selectedIndex + dir;
    while (i >= 0 && i < lines.length) {
        if (lines[i].source.kind !== 'header') {
            selectLine(i);
            const el = document.querySelector(`.line[data-index="${i}"]`);
            if (el) el.scrollIntoView({ block: 'nearest' });
            return;
        }
        i += dir;
    }
}

// init
(async () => {
    const res = await fetch('/api/lines');
    expandedLines = await res.json();
    lines = rebuildDisplayLines();
    renderLines();
})();
</script>
</body>
